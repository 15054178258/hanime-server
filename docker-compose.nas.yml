services:
  hanime-server:
    # v4.0.3: 使用本仓库自行构建的镜像（含图片代理/系列批量下载等新功能）
    image: ghcr.io/15054178258/hanime-server:latest
    container_name: hanime-server
    ports:
      - "7788:7788"
    volumes:
      # 挂载一个目录即可持久化所有用户数据（数据库、下载文件、封面）
      - /volume1/docker/hanime/data:/app/backend/data
    environment:
      - TZ=Asia/Shanghai
      - USE_PROXY=false
      - PROXY_URL=
      # 图片代理缓存上限（MB），超出自动淘汰最久未访问的图片
      - IMAGE_CACHE_MAX_MB=512
    restart: unless-stopped